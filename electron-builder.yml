appId: com.quangtrong.1506.autofrontend
productName: Auto Test Frontend
copyright: Copyright © 2025 Quangtrong1506

directories:
   output: dist
   buildResources: resources

files:
   - from: .
     filter:
        - package.json
        - app

asarUnpack:
   - drivers/**

extraResources:
   - from: resources/icon.ico
     to: icon.ico
   - from: drivers/
     to: drivers/

win:
   target:
      - nsis
   icon: resources/icon.ico

artifactName: 'Auto-Frontend.${version}.setup.${ext}'

nsis:
   createDesktopShortcut: true
   createStartMenuShortcut: true
   oneClick: true
   runAfterFinish: true

publish:
   provider: github
   owner: quangtrong1506
   repo: auto-frontend
